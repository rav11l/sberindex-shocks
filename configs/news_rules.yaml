# Правила разметки новостного потока GDELT (§5.2 дизайна). Языковые модели не используются.
# url_regex проверяется по ссылке на статью в нижнем регистре: у российских СМИ в адресе
# обычно транслит заголовка (ria.ru/20240408/evakuatsiya-...), у зарубежных — английский.
# cameo_codes — коды событий CAMEO; cameo_requires_url: true — код засчитывается только вместе с url_regex.
# expected_sign — ожидаемый знак влияния на безналичные расходы жителей.
# url_require — регулярное выражение, которое тоже должно встретиться в адресе (контекст России):
#   без него геокодер GDELT относит к России британские и американские новости об ипотеке.
# url_exclude — если встречается в адресе, совпадение отбрасывается (военный контекст эвакуаций и т. п.).
# scope: national — новость всегда федеральная; auto — по геопривязке места события;
#   local — только привязка к МО (привязка к стране целиком отбрасывается).
version: 1
types:
  key_rate:
    url_require: "russia|russian|rossi|rf-|cbr|bank-of-russia|moscow|kremlin|putin|\\.ru/"
    scope: national
    expected_sign: negative
    url_regex: "klyuchev\\w*-stavk|klyuchevuyu-stavku|key-rate|keyrate|interest-rate|bank-of-russia-(raise|hike|cut)|tsb-(povysil|snizil)|cbr-(raise|hike)"
  mortgage_rules:
    url_require: "russia|russian|rossi|rf-|cbr|bank-of-russia|moscow|kremlin|putin|\\.ru/"
    scope: national
    expected_sign: negative
    url_regex: "lgotn\\w*-ipotek|ipotek|mortgage"
  tariff:
    url_require: "russia|russian|rossi|rf-|cbr|bank-of-russia|moscow|kremlin|putin|\\.ru/"
    scope: auto
    expected_sign: negative
    url_regex: "tarif\\w*-zhkh|kommunaln\\w*-tarif|indeksats\\w*-tarif|utility-(tariff|price|bill)"
  social_payment:
    url_require: "russia|russian|rossi|rf-|cbr|bank-of-russia|moscow|kremlin|putin|\\.ru/"
    scope: auto
    expected_sign: positive
    url_regex: "vyplat|posobi|materinsk\\w*-kapital|indeksats\\w*-pensi|pension-(increase|indexation)"
  disaster:
    scope: local
    expected_sign: positive          # выплаты пострадавшим; прямой ущерб даёт обратный знак, это проверяется в отчёте
    url_regex: "navodnen|pavod|zatoplen|podtoplen|proryv-damb|dambu|evakuats|flood|dam-(burst|breach)|evacuat"
    url_exclude: "ukrain|kyiv|kiev|drone|shell|missile|strike|attack|incursion|war-|nato|zaporizh|kakhovka|nuclear-plant|front|border-cities|belgorod|kursk|bryansk|shebekino|sudzha"
    cameo_codes: ["0233", "073"]      # призыв к гуманитарной помощи; оказание гуманитарной помощи
    cameo_requires_url: true
  trade_restriction:
    url_require: "russia|russian|rossi|rf-|cbr|bank-of-russia|moscow|kremlin|putin|\\.ru/"
    scope: auto
    expected_sign: negative
    url_regex: "zapret\\w*-prodazh|ogranichen\\w*-prodazh|sales-ban|alcohol-ban"
