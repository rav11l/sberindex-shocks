# Все параметры прогона. Любой ключ переопределяется из командной строки:
#   python -m sshocks.cli forecast --set forecast.max_series=200
seed: 42
output_dir: outputs

data:
  raw_dir: data/raw
  file: sberindex_mo_spending.parquet     # или sberindex_mo_spending.csv.zip
  hashes: data/hashes.json
  download_if_missing: false
  category: Все категории                  # Продовольствие | Здоровье | Общественное питание | Транспорт | Маркетплейсы
  min_obs: 24                               # только ряды с полной историей 01.2023–12.2024

events:
  registry: data/events/registry.csv
  only_verified: true                       # в модели идут только события со ссылкой на первоисточник

news:                                       # новостной поток: GDELT 1.0, разметка правилами (без языковых моделей)
  source: gdelt_v1_events
  start: "2023-01-01"
  end: "2024-12-31"
  country: RS                               # код FIPS места события
  raw_dir: data/raw/gdelt                   # отфильтрованные записи по месяцам, в git не входят
  manifest: data/news/gdelt_manifest.csv    # sha256 каждого скачанного дневного архива
  rules: configs/news_rules.yaml
  types: [disaster]                         # на 2023–2024 работает только ЧС: решения по ставке в GDELT почти не
                                            # попадают (1 из 8), остальные типы дают лишь ложные совпадения (docs/full_run.md, §3а)
  labeled: data/news/gdelt_labeled.csv
  review: data/news/gdelt_review.csv        # выборка для ручной проверки, колонку check заполняет человек
  review_n: 200
  recall_window_days: 7
  use_in_models: false                      # включается после ручной проверки точности правил

forecast:
  horizons: [1, 2, 3]
  origins: ["2024-06-01", "2024-07-01", "2024-08-01", "2024-09-01"]
  max_series: 400                           # null — все ряды; Prophet на всех ≈ 30–40 мин
  models:
    snaive:        {}
    snaive_growth: {window: 3}
    ets_relative:  {}
    prophet:       {yearly_fourier: 3}
    lgbm:          {use_events: true, min_growth_obs: 3}
    lgbm_noevents: {fn: lgbm, use_events: false, min_growth_obs: 3}
    chronos:       {checkpoint: amazon/chronos-bolt-small, mode: relative, enabled: true}
    chronos_level: {fn: chronos, checkpoint: amazon/chronos-bolt-small, mode: level, enabled: true}
    timesfm:       {checkpoint: google/timesfm-2.0-500m-pytorch, mode: relative, enabled: false}

analysis:                                   # разборы поверх готовых прогнозов (команда analyze)
  size_groups: 5                            # квантили среднего уровня расходов за 2023 год
  dm_base: prophet
  ensembles:
    - {name: ens_chronos_ets, members: [chronos_base, ets_relative]}
    - {name: ens_ets_snaive, members: [ets_relative, snaive_growth]}
    - {name: ens_chronos_snaive, members: [chronos_base, snaive_growth]}
    - {name: ens3_mean, members: [chronos_base, ets_relative, snaive_growth]}
    - {name: ens3_median, members: [chronos_base, ets_relative, snaive_growth], how: median}
    - {name: ens4_mean, members: [chronos_base, chronos, ets_relative, snaive_growth]}
  switches:
    - {name: switch_big_chronos, big: chronos_base, small: ets_relative, q: 0.8}

changepoint:
  eval_start: "2024-04-01"                  # прирост г/г определён с 01.2024, детекторам нужно 3 точки истории
  eval_end: "2024-12-01"
  max_series: 600
  repeats: 3
  share_shocked: 0.5
  deltas: [-0.20, -0.10, -0.05, 0.05, 0.10, 0.20]
  max_delay: 2
  news_simulation: {recall_news: 0.6, false_news_rate: 0.05}
  study_pre:  ["2024-01-01", "2024-03-01"]  # окна событийного анализа реальных ЧС
  study_post: ["2024-04-01", "2024-06-01"]
  fa_target: 3.0                            # доля ложных тревог, при которой детекторы сравниваются
  sweep_max_series: 1000
  sweep_repeats: 2
  sweep:                                    # сетка порогов: детектор -> {параметр: значения}
    zscore:        {k: [2.0, 2.5, 3.0, 3.5, 4.0, 5.0]}
    cross_section: {k: [2.0, 2.5, 3.0, 3.5, 4.0, 5.0]}
    cusum:         {h: [2.0, 3.0, 4.0, 6.0, 8.0, 12.0]}
    bocpd:         {threshold: [0.2, 0.3, 0.5, 0.7, 0.9]}
    pelt:          {penalty: [1.0, 2.0, 3.0, 5.0, 8.0, 12.0]}
    binseg:        {penalty: [1.0, 2.0, 3.0, 5.0, 8.0, 12.0]}
  detectors:
    zscore:        {k: 3.0}
    cross_section: {k: 3.0}
    cusum:         {k: 0.5, h: 4.0}
    bocpd:         {hazard: 0.04, threshold: 0.5, use_news: true, event_boost: 6.0}
    pelt:          {penalty: 3.0, recent: 1}
    binseg:        {penalty: 3.0, recent: 1}
